name: Smoke checks

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2.0" "numpy>=1.26.0" "streamlit>=1.36.0" "plotly>=5.22.0" "python-dotenv>=1.0.0"

      - name: Run smoke_check
        env:
          PYTHONUTF8: "1"
        run: python scripts/smoke_check.py
